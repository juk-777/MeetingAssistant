<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сценарий экрана</title>
<!--
  Сценарий замера правила смены экрана (docs/specs/2026-11-20-screen-capture.md, критерий 4; стенд
  prototype/screen-bench). Страница сама проигрывает фазы по часам от загрузки, ожидаемые смены — в EXPECTED.
  Справа всё время идёт «видео» звонка — шум и движущиеся фигуры, как лица в окне звонка: меняется на каждом кадре.
  Часы сценария идут с первого щелчка по странице (до него — «щёлкните, чтобы начать»): страницу открывает человек,
  во весь экран — F11. screen-scenario.html?task — только условие задачи и видео, без фаз: для живой проверки окна
  подсказок.
-->
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #d4d4d4; font: 18px/1.5 Consolas, monospace; overflow: hidden; }
  #editor { position: absolute; left: 24px; top: 24px; width: 58%; bottom: 24px; white-space: pre; }
  #task { position: absolute; left: 24px; top: 24px; width: 58%; bottom: 24px; font: 22px/1.6 Segoe UI, sans-serif; white-space: pre-wrap; display: none; }
  #call { position: absolute; right: 24px; top: 24px; width: 36%; aspect-ratio: 16 / 9; background: #000; }
  #phase { position: absolute; right: 24px; bottom: 24px; color: #6a9955; }
  .cursor { background: #d4d4d4; }
</style>
</head>
<body>
<div id="editor"></div>
<div id="task"></div>
<canvas id="call" width="480" height="270"></canvas>
<div id="phase"></div>
<script>
// Фазы, секунды от загрузки:
//   0–40    только видео — смен нет (кроме первого кадра записи);
//   40–106  набор кода: строка 3 с, пауза 8 с — смена в каждую паузу (6 строк);
//   106–136 условие задачи вместо редактора — одна смена;
//   136–166 снова код вместо условия — одна смена; дальше мигает курсор, видео идёт — смен нет.
// Всего 9 смен: первый кадр, 6 пауз набора, условие, возврат к коду.
const LINES = [
  'def two_sum(nums, target):',
  '    seen = {}',
  '    for index, value in enumerate(nums):',
  '        rest = target - value',
  '        if rest in seen: return seen[rest], index',
  '        seen[value] = index',
];
const TASK = 'Задача.\n\nДан массив целых чисел nums и число target. Верните индексы двух разных элементов, сумма ' +
  'которых равна target. Ровно одно решение; один элемент нельзя взять дважды.\n\nПример: nums = [2, 7, 11, 15], ' +
  'target = 9 → [0, 1].\n\nОграничения: до 10^5 элементов, значения до 10^9 по модулю. Ожидается O(n).';
const TYPE_SECONDS = 3, PAUSE_SECONDS = 8, CODE_START = 40;
const TASK_START = CODE_START + LINES.length * (TYPE_SECONDS + PAUSE_SECONDS);
const BLINK_START = TASK_START + 30, END = BLINK_START + 30;

const editor = document.getElementById('editor'), task = document.getElementById('task');
const phase = document.getElementById('phase'), canvas = document.getElementById('call'), ctx = canvas.getContext('2d');
let start = null;
task.textContent = TASK;
phase.textContent = 'щёлкните, чтобы начать';
document.addEventListener('click', () => {
  if (start === null) { start = performance.now(); requestAnimationFrame(frame); }
});

function video(t) {
  const image = ctx.createImageData(canvas.width, canvas.height);
  for (let i = 0; i < image.data.length; i += 4) {
    const v = 60 + Math.random() * 60;
    image.data[i] = v; image.data[i + 1] = v * 0.9; image.data[i + 2] = v * 0.8; image.data[i + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
  ctx.fillStyle = '#c8a27a';
  ctx.beginPath();
  ctx.arc(240 + Math.sin(t * 1.3) * 60, 140 + Math.cos(t * 0.9) * 30, 70, 0, Math.PI * 2);
  ctx.fill();
}

const TASK_ONLY = location.search === '?task';

function frame() {
  const t = (performance.now() - start) / 1000;
  video(t);
  if (TASK_ONLY) {
    editor.style.display = 'none'; task.style.display = 'block';
    phase.textContent = 'условие задачи';
  } else if (t < CODE_START) {
    phase.textContent = 'только видео';
  } else if (t < TASK_START) {
    const into = t - CODE_START, cycle = TYPE_SECONDS + PAUSE_SECONDS, line = Math.floor(into / cycle);
    const typed = Math.min(1, (into - line * cycle) / TYPE_SECONDS);
    const shown = LINES.slice(0, line).join('\n') + (line > 0 ? '\n' : '') +
      LINES[line].slice(0, Math.round(LINES[line].length * typed));
    editor.textContent = shown;
    phase.textContent = 'набор кода, строка ' + (line + 1);
  } else if (t < BLINK_START) {
    editor.style.display = 'none'; task.style.display = 'block';
    phase.textContent = 'условие задачи';
  } else if (t < END) {
    task.style.display = 'none'; editor.style.display = 'block';
    editor.innerHTML = '';
    editor.textContent = LINES.join('\n') + '\n';
    if (Math.floor(t * 2) % 2 === 0) {
      const cursor = document.createElement('span');
      cursor.className = 'cursor'; cursor.textContent = ' ';
      editor.appendChild(cursor);
    }
    phase.textContent = 'курсор мигает';
  } else {
    phase.textContent = 'конец сценария';
    return;
  }
  requestAnimationFrame(frame);
}
if (location.search === '?task') { start = performance.now(); requestAnimationFrame(frame); }
</script>
</body>
</html>
