# Выпуск по тегу vX.Y.Z на main: сверка версии плагина с тегом, тесты, сборка meeting под Windows и Linux, релиз
# GitHub с архивами, их SHA-256, install.ps1 и install.sh. Устройство — docs/specs/2026-11-12-distribution.md,
# Linux — docs/specs/2026-11-14-linux-capture.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Выпускается только то, что уже в main: тег на ветке задачи релизом не становится.
      - name: Тег на main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - id: version
        run: echo "version=$(./scripts/release-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Сборка под Windows на Linux-раннере: нативные библиотеки sherpa-onnx и onnxruntime приходят из NuGet под win-x64.
      - name: Сборка meeting под Windows
        run: >
          dotnet publish src/MeetingAssistant.Cli/MeetingAssistant.Cli.csproj
          -c Release -r win-x64 --self-contained true -p:Version="$VERSION" -o publish-win --nologo

      - name: Сборка meeting под Linux
        run: >
          dotnet publish src/MeetingAssistant.Cli/MeetingAssistant.Cli.csproj
          -c Release -r linux-x64 --self-contained true -p:Version="$VERSION" -o publish-linux --nologo

      # Linux — tar: zip не хранит бит исполнения, и распакованный meeting не запустился бы.
      - name: Архивы и контрольные суммы
        run: |
          (cd publish-win && zip -qr ../meeting-win-x64.zip .)
          sha256sum meeting-win-x64.zip > meeting-win-x64.zip.sha256
          tar -czf meeting-linux-x64.tar.gz -C publish-linux .
          sha256sum meeting-linux-x64.tar.gz > meeting-linux-x64.tar.gz.sha256

      # Версия с суффиксом (0.2.0-rc.1) — предварительный релиз: «последний» у установки остаётся прежним.
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ $VERSION != *-* ]] || prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" meeting-win-x64.zip meeting-win-x64.zip.sha256 scripts/install.ps1 \
            meeting-linux-x64.tar.gz meeting-linux-x64.tar.gz.sha256 scripts/install.sh \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${prerelease[@]}"
